<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GF Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Hearts background will be generated by JavaScript -->
    
    <!-- Personalization Modal -->
    <div class="personalization-modal" id="personalizationModal">
        <div class="modal-content">
            <h2>💖 Your Personalize GF Experience 💖</h2>
            <form id="personalizationForm">
                <div class="form-group">
                    <label for="userName">What name would you like to be called?</label>
                    <input type="text" id="userName" placeholder="e.g., Love, Sweetheart, etc." required>
                </div>
                
                <div class="form-group">
                    <label for="userHobbies">Your hobbies and interests</label>
                    <textarea id="userHobbies" placeholder="e.g., Gym, Reading, Traveling, Coding..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="userAge">Age Range</label>
                    <select id="userAge" required>
                        <option value="">Select your age range</option>
                        <option value="18-25">18-25</option>
                        <option value="26-35">26-35</option>
                        <option value="36-45">36-45</option>
                        <option value="46+">46+</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Chatting Preferences</label>
                    <div class="preferences-grid">
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="romantic"> Romantic 💕
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="friendly"> Friendly 😊
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="playful"> Playful 😄
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="sarcastic"> Sarcastic 😏
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="supportive"> Supportive 🤗
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="preferences" value="flirty"> Flirty 😘
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="start-chat-btn">Start Romantic Chat 💌</button>
            </form>
        </div>
    </div>
    
    <!-- Chat Container (Hidden Initially) -->
    <div class="chat-container" id="chatContainer" style="display: none;">
        <h1 id="chatTitle">💖 Romantic Chat 💖</h1>
        <div class="chat-log" id="chatLog">
            <!-- Messages will appear here -->
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Share your thoughts with your special friend...">
            <button id="sendBtn">Send 💌</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
